# The doorbell between a couple's two Macs, and the invite email (see src/). Deploy: npx wrangler@4 deploy
# Secret: RESEND_API_KEY (npx wrangler@4 secret put RESEND_API_KEY), for /v1/invite.
name = "ournotch-live"
main = "src/index.js"
compatibility_date = "2026-09-28"
routes = [{ pattern = "live.ournotch.app", custom_domain = true }]

[vars]
# The kill switch: "off" turns the doorbell off for everyone; the apps carry on with iCloud alone.
LIVE = "on"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limit"]
