<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OurNotch: a heart dropping out of a MacBook notch, on a macOS-style app tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B88"/>
      <stop offset="1" stop-color="#FF2D55"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#9E0F2E" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- the notch, hanging from the top edge, with its curved "ears" -->
  <path d="M300 100 Q330 100 330 130 V170 Q330 222 382 222 H642 Q694 222 694 170 V130 Q694 100 724 100 Z" fill="#16141A"/>
  <circle cx="512" cy="160" r="13" fill="#2E2A36"/>
  <!-- a small heart on its way out, then the big one -->
  <path transform="translate(512 300) scale(4.2)" d="M0 7 C -11 -1 -11 -10 -4.5 -10 C -1.5 -10 0 -7.5 0 -6 C 0 -7.5 1.5 -10 4.5 -10 C 11 -10 11 -1 0 7 Z" fill="#FFD3DC"/>
  <path transform="translate(512 600) scale(17)" d="M0 7 C -11 -1 -11 -10 -4.5 -10 C -1.5 -10 0 -7.5 0 -6 C 0 -7.5 1.5 -10 4.5 -10 C 11 -10 11 -1 0 7 Z" fill="#FFFFFF" filter="url(#soft)"/>
</svg>
